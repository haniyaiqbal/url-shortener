services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shortener']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://shortener:shortener@postgres:5432/shortener
      REDIS_URL: redis://redis:6379
      # Demo-only secret. Generate a real one with: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me-0123456789abcdef}
      APP_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:8080
      # nginx (the web container) sits on Docker's private network.
      TRUST_PROXY: uniquelocal
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  postgres-data:
